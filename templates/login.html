<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login | GEHU Helper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: url("{{ url_for('static', filename='image.png') }}") no-repeat center center fixed;
      background-size: cover;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-container {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
      padding: 40px;
      width: 350px;
      text-align: center;
    }

    h2 {
      color: #2e3b4e;
      margin-bottom: 25px;
      font-size: 24px;
      font-weight: bold;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      font-size: 16px;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      border-color: #007BFF;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background: #007BFF;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #0056b3;
    }

    .error {
      color: red;
      margin-bottom: 10px;
      font-size: 14px;
    }

    footer {
      margin-top: 15px;
      font-size: 12px;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h2>GEHU Student Login</h2>
    {% if error %}
      <p class="error">{{ error }}</p>
    {% endif %}
    <form action="{{ url_for('login') }}" method="POST">
      <input type="text" name="student_id" placeholder="Enter Student ID" required>
      <input type="password" name="password" placeholder="Enter Password" required>
      <button type="submit">Login</button>
    </form>
    <footer>© Graphic Era Hill University</footer>
  </div>

</body>
</html>
